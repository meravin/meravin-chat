# Generated with: xcodegen generate  (run from ios/)
# The .xcodeproj is gitignored — this file is the source of truth.
name: YourChat

options:
  bundleIdPrefix: dev.meravin
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Free "Personal Team" signing: pick your Apple ID under Signing &
    # Capabilities once, and Xcode fills DEVELOPMENT_TEAM in. Two things to
    # expect on a free account — builds expire after 7 days and need
    # reinstalling, and the HealthKit entitlement may be refused (if it is,
    # the Home cards fall back to whatever the relay last stored).
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  YourChat:
    type: application
    platform: iOS
    sources:
      - path: YourChat
        excludes:
          # Real credentials live in a gitignored file created from the example.
          - "Config/Secrets.example.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.meravin.chat
        INFOPLIST_KEY_CFBundleDisplayName: YourChat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # HealthKit powers the Home cards: steps, heart rate, sleep, cycle, body.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "读取步数、心率、睡眠和生理周期，用来显示首页的健康卡片。"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "在你点「今天来了」时，把生理期记录写回健康 App。"
        # Local development talks to the relay over plain ws://127.0.0.1.
        # Release builds always use wss:// — see Secrets.swift.
        INFOPLIST_KEY_NSAppTransportSecurity: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    entitlements:
      path: YourChat/YourChat.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: YourChat/Info.plist
      properties:
        CFBundleDisplayName: YourChat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "读取步数、心率、睡眠和生理周期，用来显示首页的健康卡片。"
        NSHealthUpdateUsageDescription: "在你点「今天来了」时，把生理期记录写回健康 App。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
